# Render Blueprint for the API. The front end deploys to Vercel and proxies /api here.
services:
  - type: web
    name: worthywaste-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      # Scripted scale: 28 kg always reads 27.4 kg, so every demo take matches.
      - key: WW_SCRIPTED
        value: "1"
